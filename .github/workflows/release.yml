name: Release

# Pushing a version tag (e.g. `v1.0.0`) builds the release APK, publishes a
# GitHub Release with that APK attached and the matching CHANGELOG.md
# section as the release notes, and — once TEAMS_WEBHOOK_URL is configured
# (see "Teams setup" below) — posts the same notes + a download link to the
# team's Teams channel.
on:
  push:
    tags:
      - 'v*.*.*'
  # Manual re-send path: re-post the Teams notification for a tag that was
  # already released, without rebuilding the APK or touching the existing
  # GitHub Release (e.g. the notify step silently failed, as happened on
  # v1.1.5 -- RequestEntityTooLarge from a changelog section too big for
  # Power Automate's card size limit). Run from the Actions tab with the
  # tag to resend.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to resend the Teams notification for (e.g. v1.1.5)'
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version from tag
        id: ver
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        if: github.event_name != 'workflow_dispatch'
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        if: github.event_name != 'workflow_dispatch'
        with:
          channel: stable

      - run: flutter pub get
        if: github.event_name != 'workflow_dispatch'
      - run: flutter build apk --release
        if: github.event_name != 'workflow_dispatch'

      - name: Rename APK
        if: github.event_name != 'workflow_dispatch'
        run: cp build/app/outputs/flutter-apk/app-release.apk "krishi-spray-${{ steps.ver.outputs.tag }}.apk"

      - name: Extract this version's CHANGELOG.md section
        run: python3 .github/scripts/extract_changelog.py "${{ steps.ver.outputs.version }}" > release_notes.md

      - name: Create GitHub Release
        if: github.event_name != 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "Krishi Spray ${{ steps.ver.outputs.tag }}"
          body_path: release_notes.md
          files: krishi-spray-${{ steps.ver.outputs.tag }}.apk

      # Always runs; notify_teams.py itself skips quietly if the secret is
      # empty. (An `if: secrets.TEAMS_WEBHOOK_URL != ''` guard here was
      # tried first but GitHub Actions rejected the whole file as invalid
      # with it in place — moved the check into the script instead.)
      - name: Notify Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          RELEASE_URL="${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.ver.outputs.tag }}"
          python3 .github/scripts/notify_teams.py "$TEAMS_WEBHOOK_URL" "${{ steps.ver.outputs.tag }}" "$RELEASE_URL" release_notes.md

# ---------------------------------------------------------------------------
# Teams setup (one-time, done in the Teams UI — not in this file):
#
# 1. Open the "release channel - Krishi apk" channel.
# 2. "..." (more options) on the channel > Workflows.
# 3. Search for and select the template "Post to a channel when a webhook
#    request is received". Point it at this channel, name it (e.g. "Krishi
#    Spray release notifier"), and finish creating it.
# 4. Teams will show you a webhook URL at the end — copy it.
# 5. In this GitHub repo: Settings > Secrets and variables > Actions >
#    New repository secret. Name: TEAMS_WEBHOOK_URL. Value: the URL from
#    step 4.
# 6. Repeat in the other repo too if releases are cut from both.
#
# That's it — the next tag push will post to the channel automatically.
# Note: this posts release notes + a *link* to download the APK from the
# GitHub Release, not the raw APK file itself — Teams webhooks don't support
# arbitrary file uploads without a more involved SharePoint/Graph API flow.
# ---------------------------------------------------------------------------
